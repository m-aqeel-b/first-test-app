query RunInput {
  cart {
    lines {
      id
      merchandise {
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
      cost {
        subtotalAmount {
          amount
          currencyCode
        }
      }
      quantity
    }
  }
}
